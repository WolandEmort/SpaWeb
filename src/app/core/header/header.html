<nav class="navbar">

    <a routerLink="/items" class="navbar-brand">
        <h1>{{ appName }}</h1>
    </a>

    <div class="nav-links">
        <a routerLink="/items"
           routerLinkActive="active"
           [routerLinkActiveOptions]="{exact: true}">
            Каталог
        </a>
        <a routerLink="/about" routerLinkActive="active">Про нас</a>

        @if (authService.currentUser$ | async) {
            <a routerLink="/admin/add-item" routerLinkActive="active" class="admin-link">
                + Додати
            </a>
        }
    </div>

    <div class="header-actions">
        <button class="action-btn cart-btn">
            🛒 <span class="btn-text">Кошик</span>
            @if (cartCount > 0) {
                <span class="badge">{{ cartCount }}</span>
            }
        </button>

        @if (authService.currentUser$ | async; as user) {
            <div class="user-menu" style="display: flex; gap: 10px; align-items: center;">
                <button (click)="authService.logout()" class="action-btn login-btn">Вийти</button>
            </div>
        } @else {
            <a routerLink="/login" class="action-btn login-btn">Увійти</a>
        }
    </div>

</nav>
