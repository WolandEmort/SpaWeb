<div class="login-container">
    <h2>Вхід в особистий кабінет</h2>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">

        <input type="email" formControlName="email" placeholder="Email">

        <input type="password" formControlName="password" placeholder="Пароль">

        <button type="submit" [disabled]="loginForm.invalid">Увійти</button>

    </form>

    <p style="margin-top: 20px; color: #636e72; font-size: 0.9rem;">
        Немає акаунту?
        <a routerLink="/register" style="color: #6c5ce7; font-weight: 600; text-decoration: none;">Зареєструватися</a>
    </p>
</div>
